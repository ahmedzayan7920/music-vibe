name: music_vibe
description: "A powerful audio and media player."

publish_to: "none"

version: 1.1.1+3

environment:
  sdk: ^3.5.0

dependencies:
  android_intent_plus: ^6.0.0
  audio_service: ^0.18.15
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  get_it: ^8.0.3
  just_audio: ^0.10.5
  on_audio_query_pluse: ^3.0.6
  package_info_plus: ^9.0.0
  scrollable_positioned_list: ^0.3.8
  shared_preferences: ^2.3.2
  lottie: ^3.3.1
  permission_handler: ^12.0.1
  equatable: ^2.0.8


dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.1
  flutter_test:
    sdk: flutter
  rename: ^3.0.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A1A1A"
  adaptive_icon_foreground: "assets/app_icon.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#1A1A1A"
  android: true
  ios: true
  web: false
  android_12:
    color: "#1A1A1A"
  fullscreen: true
